<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><meta name="description" content="وين نلقى؟ — دليل محلي تونسي">
<link rel="manifest" href="manifest.json"><title>وين نلقى؟</title>
<style>
:root{--p:#0f766e;--p2:#115e59;--bg:#f5f8f7;--card:#fff;--text:#17201d;--muted:#68756f;--line:#dfe7e3;--danger:#b42318;--gold:#b7791f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:0 14px}header{background:linear-gradient(145deg,var(--p),var(--p2));color:#fff;padding:22px 0 26px;border-radius:0 0 28px 28px}.brand{font-size:29px;font-weight:900}.sub{opacity:.9;margin-top:4px}.search{margin-top:17px;background:#fff;border-radius:16px;padding:4px;display:flex;box-shadow:0 8px 25px #0002}.search input{border:0;outline:0;flex:1;padding:13px;font-size:16px;direction:rtl}.search button{border:0;background:var(--p);color:#fff;border-radius:12px;padding:0 17px;font-weight:800;cursor:pointer}main{padding:17px 0 95px}h2{font-size:20px;margin:18px 2px 10px}.row{display:flex;gap:8px;overflow:auto;padding-bottom:5px}.chip{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:999px;white-space:nowrap;cursor:pointer}.chip.active{background:#dff4f0;border-color:#9bd9d0;color:#075e56;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.cat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;cursor:pointer}.cat.active{outline:2px solid #72c8bc;background:#effaf8}.ico{font-size:26px}.cat b{display:block;margin-top:5px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:17px}.select{padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}.cards{display:grid;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.top{display:flex;justify-content:space-between;gap:10px}.name{font-size:18px;font-weight:900}.meta{color:var(--muted);font-size:14px;margin-top:5px}.badge{font-size:12px;background:#e6f6eb;color:#126b35;padding:5px 8px;border-radius:999px;height:max-content}.desc{margin:10px 0;color:#34423d}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions a,.actions button{border:0;border-radius:11px;padding:9px 12px;text-decoration:none;font-weight:800;font-size:13px;cursor:pointer}.call{background:#e5f6eb;color:#126b35}.map{background:#e6f0ff;color:#245ca8}.wa{background:#e8f8f2;color:#08785b}.fav{background:#fff5df;color:#8a5a00}.share{background:#f0f2f1;color:#33403b}.loc{background:#fff;border:1px solid var(--line)!important}.empty{text-align:center;color:var(--muted);padding:35px}.footer{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:18px;padding:8px}.footer button{border:0;background:none;color:var(--muted);font-size:13px;padding:5px 9px;cursor:pointer}.footer .on{color:var(--p);font-weight:900}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.show{display:flex}.sheet{background:#fff;width:min(680px,100%);border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet h2{margin-top:0}.form{display:grid;gap:10px}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit}.form textarea{min-height:80px}.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#eef2f0}.danger{color:var(--danger)}.notice{padding:10px;border-radius:12px;background:#fff7e6;color:#7a5200;font-size:13px}.distance{color:var(--p);font-weight:800}.hidden{display:none}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.modal{align-items:center}.sheet{border-radius:22px}}
</style></head>
<body>
<header><div class="wrap"><div class="brand">وين نلقى؟ 🇹🇳</div><div class="sub">دليل محلي تونسي — ابحث، اتصل، واتجه بسهولة</div><div class="search"><input id="q" placeholder="شنوة تحب تلقى؟ طبيب، ميكانيكي، مطعم..." autocomplete="off"><button id="searchBtn">بحث</button></div></div></header>
<main class="wrap"><h2>الولايات</h2><div class="row" id="govs"></div><h2>الفئات الرئيسية</h2><div class="grid" id="cats"></div><div class="toolbar"><h2 style="margin:0">النتائج <span id="count"></span></h2><select class="select" id="sort"><option value="default">الترتيب الافتراضي</option><option value="distance">الأقرب</option><option value="name">الاسم</option><option value="rating">الأعلى تقييماً</option></select></div><div id="locationNotice" class="notice hidden" style="margin:10px 0">فعّل الموقع لعرض المسافة وترتيب النتائج حسب القرب.</div><div class="cards" id="results"></div></main>
<div class="footer"><button id="homeBtn" class="on">🏠 الرئيسية</button><button id="nearBtn">📍 القريب مني</button><button id="addBtn">➕ أضف نشاطك</button></div>
<div class="modal" id="modal"><div class="sheet"><h2>➕ إضافة نشاطك</h2><p class="meta">النشاط الذي تضيفه يُحفظ على هذا الجهاز. لن يظهر تلقائياً للزوار الآخرين حتى نربطه بقاعدة بيانات.</p><form class="form" id="businessForm"><input id="fName" required placeholder="اسم النشاط"><div class="row2"><select id="fGov" required></select><input id="fCity" required placeholder="المدينة"></div><select id="fCat" required></select><input id="fPhone" placeholder="الهاتف (مثال 21620123456)"><input id="fAddress" placeholder="العنوان"><textarea id="fDesc" placeholder="وصف مختصر"></textarea><div class="row2"><input id="fLat" type="number" step="any" placeholder="Latitude (اختياري)"><input id="fLng" type="number" step="any" placeholder="Longitude (اختياري)"></div><div class="row2"><button type="button" class="btn secondary" id="closeModal">إلغاء</button><button class="btn primary" type="submit">حفظ النشاط</button></div></form></div></div>
<script>
const govs=["الكل","باجة","جندوبة","الكاف","سليانة"];const cats=[["🏥","الصحة"],["🚗","السيارات وقطع الغيار"],["🚚","النقل والتوصيل"],["🌾","الأعلاف والمنتجات الفلاحية"],["🛒","المواد الغذائية"],["🔧","الحرف والخدمات"],["🏪","المحلات التجارية"],["🍽️","الإقامة والمطاعم"],["💼","الخدمات المهنية"],["🏛️","الخدمات والإدارات"],["🚑","خدمات الطوارئ"],["🐑","الفلاحة والحيوانات"]];
const demo=[{id:1,name:"عيادة طب أسنان تجريبية",cat:"الصحة",gov:"باجة",city:"باجة",address:"وسط مدينة باجة",phone:"",lat:36.7256,lng:9.1817,rating:4.6,verified:true,desc:"بيانات تجريبية — استبدلها ببيانات حقيقية."},{id:2,name:"Garage Nord",cat:"السيارات وقطع الغيار",gov:"باجة",city:"مجاز الباب",address:"مجاز الباب",phone:"",lat:36.649,lng:9.61,rating:4.4,verified:false,desc:"صيانة سيارات وقطع غيار — بيانات تجريبية."},{id:3,name:"مطعم الشمال",cat:"الإقامة والمطاعم",gov:"جندوبة",city:"جندوبة",address:"وسط جندوبة",phone:"",lat:36.501,lng:8.78,rating:4.3,verified:true,desc:"مطعم تجريبي للعرض فقط."},{id:4,name:"خدمات فلاحية الشمال",cat:"الأعلاف والمنتجات الفلاحية",gov:"الكاف",city:"الكاف",address:"الكاف",phone:"",lat:36.174,lng:8.704,rating:4.5,verified:false,desc:"أعلاف ومنتجات فلاحية — بيانات تجريبية."},{id:5,name:"حرفي سليانة",cat:"الحرف والخدمات",gov:"سليانة",city:"سليانة",address:"سليانة",phone:"",lat:36.083,lng:9.371,rating:4.2,verified:true,desc:"خدمات حرفية — بيانات تجريبية."}];
let businesses=demo.concat(JSON.parse(localStorage.getItem('wn_custom')||'[]'));let gov='الكل',cat='',userPos=null,favorites=new Set(JSON.parse(localStorage.getItem('wn_favs')||'[]'));
const $=id=>document.getElementById(id);
function init(){ $('govs').innerHTML=govs.map(x=>`<button class="chip ${x==='الكل'?'active':''}" data-gov="${x}">${x}</button>`).join('');$('cats').innerHTML=cats.map(x=>`<div class="cat" data-cat="${x[1]}"><div class="ico">${x[0]}</div><b>${x[1]}</b></div>`).join('');$('fGov').innerHTML=govs.filter(x=>x!=='الكل').map(x=>`<option>${x}</option>`).join('');$('fCat').innerHTML=cats.map(x=>`<option>${x[1]}</option>`).join('');document.querySelectorAll('[data-gov]').forEach(b=>b.onclick=()=>setGov(b.dataset.gov,b));document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>setCat(b.dataset.cat,b));$('q').oninput=render;$('searchBtn').onclick=render;$('sort').onchange=render;$('nearBtn').onclick=nearMe;$('addBtn').onclick=()=>openModal();$('closeModal').onclick=closeModal;$('homeBtn').onclick=()=>{gov='الكل';cat='';document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.gov==='الكل'));document.querySelectorAll('.cat').forEach(b=>b.classList.remove('active'));window.scrollTo({top:0,behavior:'smooth'});render()};$('businessForm').onsubmit=saveBusiness;render()}
function setGov(x,el){gov=x;document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()};function setCat(x,el){cat=cat===x?'':x;document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));render()}
function distKm(a,b,c,d){const R=6371,rad=Math.PI/180, x=(c-a)*rad,y=(d-b)*rad;const h=Math.sin(x/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}
function normalizePhone(p){return (p||'').replace(/\D/g,'').replace(/^00/,'')}
function render(){const q=$('q').value.trim().toLowerCase();let arr=businesses.filter(b=>(gov==='الكل'||b.gov===gov)&&(!cat||b.cat===cat)&&(!q||[b.name,b.cat,b.gov,b.city,b.address,b.desc].join(' ').toLowerCase().includes(q)));arr=arr.map(b=>({...b,distance:userPos&&Number.isFinite(+b.lat)&&Number.isFinite(+b.lng)?distKm(userPos.lat,userPos.lng,+b.lat,+b.lng):null}));const s=$('sort').value;if(s==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'ar'));if(s==='rating')arr.sort((a,b)=>b.rating-a.rating);if(s==='distance'&&userPos)arr.sort((a,b)=>(a.distance??1e9)-(b.distance??1e9));$('count').textContent=`(${arr.length})`;$('results').innerHTML=arr.length?arr.map(card).join(''):`<div class="empty">لم نجد نتائج. جرّب كلمة أخرى أو ولاية أخرى.</div>`;document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>toggleFav(+b.dataset.fav));document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>shareBusiness(+b.dataset.share));}
function card(b){const phone=normalizePhone(b.phone);const fav=favorites.has(b.id);const call=phone?`<a class="call" href="tel:+${phone}">📞 اتصال</a>`:`<button class="call" disabled title="لا يوجد رقم هاتف">📞 لا يوجد هاتف</button>`;const wa=phone?`<a class="wa" href="https://wa.me/${phone}" target="_blank" rel="noopener">💬 WhatsApp</a>`:`<button class="wa" disabled>💬 لا يوجد WhatsApp</button>`;const map=(Number.isFinite(+b.lat)&&Number.isFinite(+b.lng))?`<a class="map" href="https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}" target="_blank" rel="noopener">🗺️ الاتجاهات</a>`:'';const d=b.distance!==null&&b.distance!==undefined?` • <span class="distance">📍 ${b.distance<1?(b.distance*1000).toFixed(0)+' م':b.distance.toFixed(1)+' كم'}</span>`:'';return `<article class="card"><div class="top"><div><div class="name">${esc(b.name)}</div><div class="meta">${esc(b.cat)} • ${esc(b.gov)} • ${esc(b.city)}</div></div>${b.verified?'<span class="badge">✓ موثّق</span>':''}</div><div class="desc">${esc(b.desc||'')}</div><div class="meta">⭐ ${Number(b.rating||0).toFixed(1)} • 📍 ${esc(b.address||'')}${d}</div><div class="actions">${call}${wa}${map}<button class="fav" data-fav="${b.id}">${fav?'❤️ محفوظ':'🤍 حفظ'}</button><button class="share" data-share="${b.id}">↗ مشاركة</button></div></article>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toggleFav(id){favorites.has(id)?favorites.delete(id):favorites.add(id);localStorage.setItem('wn_favs',JSON.stringify([...favorites]));render()}
async function shareBusiness(id){const b=businesses.find(x=>x.id===id);if(!b)return;const text=`${b.name}\n${b.cat} — ${b.city}, ${b.gov}\n${b.address||''}`;if(navigator.share){try{await navigator.share({title:b.name,text})}catch(e){}}else{await navigator.clipboard?.writeText(text);alert('تم نسخ معلومات النشاط.')}}
function nearMe(){if(!navigator.geolocation){alert('المتصفح لا يدعم تحديد الموقع.');return} $('locationNotice').classList.remove('hidden');$('locationNotice').textContent='جاري تحديد موقعك...';navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lng:p.coords.longitude};$('locationNotice').textContent='تم تحديد موقعك. يمكنك اختيار «الأقرب» من الترتيب.';$('sort').value='distance';render()},()=>{$('locationNotice').textContent='لم نتمكن من الوصول إلى موقعك. اسمح بالموقع من إعدادات المتصفح.'},{enableHighAccuracy:true,timeout:10000})}
function openModal(){ $('modal').classList.add('show')};function closeModal(){ $('modal').classList.remove('show')}
function saveBusiness(e){e.preventDefault();const b={id:Date.now(),name:$('fName').value.trim(),gov:$('fGov').value,city:$('fCity').value.trim(),cat:$('fCat').value,address:$('fAddress').value.trim(),phone:$('fPhone').value.trim(),lat:$('fLat').value?Number($('fLat').value):null,lng:$('fLng').value?Number($('fLng').value):null,rating:0,verified:false,desc:$('fDesc').value.trim()||'نشاط أضيف من التطبيق.'};businesses.push(b);localStorage.setItem('wn_custom',JSON.stringify(businesses.filter(x=>x.id>5)));e.target.reset();closeModal();alert('تم حفظ النشاط على هذا الجهاز.');render()}
init();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
