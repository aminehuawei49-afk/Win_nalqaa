<script>
let base=[], custom=safeGet("wn_custom",[]), fav=safeGet("wn_fav",[]), activeCat="الكل", query="", userPos=null, liveMode=true;
const cats=[["الكل","✨"],["مطعم","🍽️"],["مقهى","☕"],["صحة","💊"],["مخبزة","🥖"],["متجر","🛒"],["خدمات","🔧"],["سيارات","🚗"]];
const govs=["الكل","تونس","أريانة","بن عروس","منوبة","نابل","بنزرت","سوسة","المنستير","المهدية","صفاقس","قابس","مدنين","قفصة","توزر","قبلي","القيروان","زغوان","باجة","جندوبة","الكاف","سليانة","القصرين","سيدي بوزيد","تطاوين"];
function safeGet(k,f){try{let x=JSON.parse(localStorage.getItem(k));return x??f}catch(e){return f}}
function save(){try{localStorage.setItem("wn_custom",JSON.stringify(custom));localStorage.setItem("wn_fav",JSON.stringify(fav))}catch(e){}}
function normalize(s){
return String(s||"").toLowerCase()
.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
.replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
.replace(/[\u064B-\u065F\u0670]/g,"")
.replace(/\s+/g," ").trim();
}
function mapCategory(c){
const n=normalize(c);
if(/مطعم|restaurant|pizzeria|pizza|food/.test(n)) return "مطعم";
if(/مقهى|قهوه|cafe|coffee/.test(n)) return "مقهى";
if(/صيدليه|pharm|sante|صحه|طبي|medical/.test(n)) return "صحة";
if(/مخبزه|boulanger|patisserie|viennoiserie|خبز|حلويات/.test(n)) return "مخبزة";
if(/سيارات|auto|mecanique|garage|lavage|car/.test(n)) return "سيارات";
if(/خدمات|service/.test(n)) return "خدمات";
if(/متجر|store|shop|commerce|fashion|boutique/.test(n)) return "متجر";
return "خدمات";
}
function mapGov(g){
const n=normalize(g);
const m={
"تونس":"تونس","ariane":"أريانة","اريانه":"أريانة","بن عروس":"بن عروس","manouba":"منوبة","منوبه":"منوبة",
"nabeul":"نابل","نابل":"نابل",
"bizerte":"بنزرت","بنزرت":"بنزرت","sousse":"سوسة","سوسه":"سوسة","monastir":"المنستير","منستير":"المنستير",
"mahdia":"المهدية","مهديه":"المهدية","sfax":"صفاقس","صفاقس":"صفاقس","gabes":"قابس","medenine":"مدنين",
"gafsa":"قفصة","tozeur":"توزر","kebili":"قبلي","kairouan":"القيروان","zaghouan":"زغوان",
"beja":"باجة","باجه":"باجة","jendouba":"جندوبة","جندوبه":"جندوبة","le kef":"الكاف","kef":"الكاف","الكاف":"الكاف",
"siliana":"سليانة","سليانه":"سليانة","kasserine":"القصرين","sidi bouzid":"سيدي بوزيد","tataouine":"تطاوين"
};
return m[n] || String(g||"غير محدد");
}
function iconFor(c){return c==="مطعم"?"🍽️":c==="مقهى"?"☕":c==="صحة"?"💊":c==="مخبزة"?"🥖":c==="سيارات"?"🚗":c==="متجر"?"🛒":"🔧"}
async function loadData(){
try{
const r=await fetch("./data_win_nalqaa.json?ts="+Date.now(),{cache:"no-store"});
if(r.ok){
const raw=await r.json();
base=raw.map(x=>({
name:x.nom||x.name||"Sans nom", cat:mapCategory(x.categorie||x.cat),
gov:mapGov(x.gouvernorat_ar||x.gov||x.gouvernorat), city:x.ville||"",
address:x.adresse||"", phone:String(x.telephone??x.phone??"").replace(/\D/g,""),
rating:x.note_google??x.rating??"", reviews:x.nombre_avis??x.reviews??"",
maps:x.lien_google_maps||x.maps||"", desc:[x.ville,x.adresse,x.source].filter(Boolean).join(" · "),
icon:iconFor(mapCategory(x.categorie||x.cat))
}));
}
document.getElementById("status").textContent="🌍 قاعدة تونس + OpenStreetMap: جاهزة للبحث";
render();
}catch(e){
base=[];
document.getElementById("status").textContent="🌍 البحث المباشر من OpenStreetMap متاح";
render();
}
}
function osmAreaNames(g){
const m={
"تونس":["Tunis","تونس"],"أريانة":["Ariana","أريانة"],"بن عروس":["Ben Arous","بن عروس"],
"منوبة":["Manouba","منوبة"],
"نابل":["Nabeul","نابل"],"بنزرت":["Bizerte","بنزرت"],"سوسة":["Sousse","سوسة"],
"المنستير":["Monastir","المنستير"],"المهدية":["Mahdia","المهدية"],"صفاقس":["Sfax","صفاقس"],
"قابس":["Gabes","Gabès","قابس"],"مدنين":["Medenine","Médenine","مدنين"],"قفصة":["Gafsa","قفصة"],
"توزر":["Tozeur","توزر"],"قبلي":["Kebili","Kébili","قبلي"],"القيروان":["Kairouan","القيروان"],
"زغوان":["Zaghouan","زغوان"],"باجة":["Beja","Béja","باجة"],"جندوبة":["Jendouba","جندوبة"],
"الكاف":["Le Kef","Kef","الكاف"],"سليانة":["Siliana","سليانة"],"القصرين":["Kasserine","القصرين"],
"سيدي بوزيد":["Sidi Bouzid","سيدي بوزيد"],"تطاوين":["Tataouine","تطاوين"]
}; return m[g]||[g];
}
const GOV_CENTERS={
"تونس":[36.8065,10.1815],"أريانة":[36.8625,10.1956],"بن عروس":[36.7545,10.2189],"منوبة":[36.8081,10.0972],
"نابل":[36.4561,10.7376],"زغوان":[36.4028,10.1429],"بنزرت":[37.2744,9.8739],"باجة":[36.7256,9.1817],
"جندوبة":[36.5011,8.7803],"الكاف":[36.1826,8.7148],"سليانة":[36.0844,9.3708],"القيروان":[35.6781,10.0963],
"القصرين":[35.1676,8.8365],"سيدي بوزيد":[35.0382,9.4849],"سوسة":[35.8256,10.6084],"المنستير":[35.7643,10.8113],
"المهدية":[35.5047,11.0622],"صفاقس":[34.7406,10.7603],"قفصة":[34.4250,8.7842],"توزر":[33.9197,8.1335],
"قبلي":[33.7044,8.9690],"قابس":[33.8815,10.0982],"مدنين":[33.3549,10.5055],"تطاوين":[32.9297,10.4518]
};
function buildAreaExpr(g){
return osmAreaNames(g).map(n=>`area["name"="${n.replace(/"/g,'\\"')}"]["admin_level"="4"]["boundary"="administrative"]`).join(";");
}
function categoryStatements(cat){
const m={
"مطعم":['nwr[amenity~"^(restaurant|fast_food|food_court)$"]'],
"مقهى":['nwr[amenity~"^(cafe|coffee_shop|ice_cream)$"]'],
"صحة":['nwr[amenity~"^(pharmacy|doctors|dentist|clinic|hospital|veterinary)$"]'],
"مخبزة":['nwr[shop~"^(bakery|pastry|confectionery)$"]'],
"متجر":['nwr[shop]'],
"خدمات":['nwr[office~"^(company|lawyer|accountant|estate_agent|insurance|government)$"]','nwr[amenity~"^(bank|post_office)$"]'],
"سيارات":['nwr[shop~"^(car|car_repair|tyres)$"]','nwr[amenity="fuel"]'],
"الكل":[
'nwr[amenity~"^(restaurant|fast_food|cafe|coffee_shop|ice_cream|pharmacy|doctors|dentist|clinic|hospital|veterinary|bank|atm|fuel|post_office)$"]',
'nwr[shop~"^(supermarket|convenience|bakery|pastry|clothes|shoes|electronics|mobile_phone|car|car_repair|tyres|hairdresser|beauty)$"]',
'nwr[tourism~"^(hotel|guest_house|hostel|museum|attraction|information)$"]',
'nwr[leisure~"^(fitness_centre|sports_centre|cinema|theatre)$"]'
]
}; return m[cat]||m["الكل"];
}
function buildAreaQuery(gov,cat){
const stmts=categoryStatements(cat).map(s=>`${s}(${gov!=="الكل"?"area.g":"area.tn"});`).join("");
let q=`[out:json][timeout:40];area["ISO3166-1"="TN"][admin_level=2]->.tn;`;
if(gov!=="الكل") q+=`(${buildAreaExpr(gov)})->.g;`;
q+=`(${stmts});out center tags;`;
return q;
}
function buildAroundQuery(gov,cat,radius){
const c=GOV_CENTERS[gov];
if(!c) return null;
const stmts=categoryStatements(cat).map(s=>`${s}(around:${radius},${c[0]},${c[1]});`).join("");
return `[out:json][timeout:40];(${stmts});out center tags;`;
}
async function overpassFetch(query){
const endpoints=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
for(const ep of endpoints){
try{
const r=await fetch(ep,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:"data="+encodeURIComponent(query)});
if(r.ok) return await r.json();
}catch(e){}
}
return null;
}
function elementsToPlaces(elements,gov){
return (elements||[])
.filter(e=>e.tags && (e.tags.name || e.tags["name:ar"]))
.map(e=>{
const t=e.tags||{};
const lat=e.lat??e.center?.lat, lon=e.lon??e.center?.lon;
const c=classifyOsm(t);
const city=t["addr:city"]||t["is_in:city"]||"";
const phone=t.phone||t["contact:phone"]||"";
const maps=(lat!=null && lon!=null)
? `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`
: "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((t.name||t["name:ar"]||"")+" Tunisie");
return {
name:t.name||t["name:ar"]||"Établissement local", cat:c,
gov:gov!=="الكل"?gov:mapGov(t["addr:state"]||t["is_in:state"]||""),
city, address:[t["addr:street"],t["addr:housenumber"],t["addr:postcode"]].filter(Boolean).join(" "),
phone:String(phone).replace(/\D/g,""), rating:"", reviews:"", maps,
desc:[city,t["addr:street"],t.website].filter(Boolean).join(" · "), icon:iconFor(c)
};
});
}
function classifyOsm(t){
const a=normalize(t.amenity||""), s=normalize(t.shop||""), name=normalize(t.name||t["name:ar"]||"");
if(/restaurant|fast_food|food_court/.test(a)) return "مطعم";
if(/cafe|coffee_shop|ice_cream/.test(a)) return "مقهى";
if(/pharmacy|doctors|dentist|clinic|hospital|veterinary/.test(a)) return "صحة";
if(/bakery|pastry|confectionery/.test(s)) return "مخبزة";
if(/car|car_repair|tyres/.test(s)) return "سيارات";
if(s) return "متجر";
return "خدمات";
}
async function loadLive(){
const gov=document.getElementById("gov").value;
const cat=activeCat;
document.getElementById("status").textContent="⏳ جاري جلب بيانات حقيقية من OpenStreetMap…";
try{
let data=await overpassFetch(buildAreaQuery(gov,cat));
let live=elementsToPlaces(data?.elements,gov);
if(live.length===0 && gov!=="الكل" && GOV_CENTERS[gov]){
const q2=buildAroundQuery(gov,cat,35000);
if(q2){
const data2=await overpassFetch(q2);
live=elementsToPlaces(data2?.elements,gov);
}
}
if(live.length===0 && data===null){
document.getElementById("status").textContent="ℹ️ Données locales affichées — OpenStreetMap est momentanément indisponible";
render();
return;
}
const existing=new Set(base.map(x=>normalize(x.name)+"|"+normalize(x.gov)+"|"+normalize(x.address)));
for(const x of live){
const k=normalize(x.name)+"|"+normalize(x.gov)+"|"+normalize(x.address);
if(!existing.has(k)){ base.push(x); existing.add(k); }
}
document.getElementById("status").textContent="🌍 OpenStreetMap : "+live.length+" résultats ajoutés";
render();
}catch(e){
document.getElementById("status").textContent="ℹ️ Données locales affichées — OpenStreetMap est momentanément indisponible";
render();
}
}
async function loadLiveAll(){
const catsToLoad=["مطعم","مقهى","صحة","مخبزة","سيارات","متجر"];
document.getElementById("status").textContent="⏳ تحميل قاعدة تونس الكبيرة… (قد يستغرق دقيقة)";
const existing=new Set(base.map(x=>normalize(x.name)+"|"+normalize(x.gov)+"|"+normalize(x.address)));
for(const gov of govs.filter(g=>g!=="الكل")){
for(const cat of catsToLoad){
try{
const q=buildAroundQuery(gov,cat,35000);
if(!q) continue;
const d=await overpassFetch(q);
const places=elementsToPlaces(d?.elements,gov);
for(const x of places){
const k=normalize(x.name)+"|"+normalize(x.gov)+"|"+normalize(x.address);
if(!existing.has(k)){ base.push(x); existing.add(k); }
}
}catch(e){}
await new Promise(res=>setTimeout(res,250));
}
document.getElementById("status").textContent="⏳ "+gov+"… ("+base.length+" établissement(s) جمعناهم لحد الآن)";
}
document.getElementById("status").textContent="🌍 قاعدة كاملة: "+base.length+" établissement(s)";
render();
}
function allData(){return base.concat(custom)}
function selectCat(c){activeCat=c;renderCats();render();loadLive()}
function renderCats(){document.getElementById("categories").innerHTML=cats.map(x=>`<button class="cat ${activeCat===x[0]?'active':''}" onclick="selectCat('${x[0]}')"><span class="ico">${x[1]}</span><span>${x[0]}</span></button>`).join("")}
function renderChips(){document.getElementById("govchips").innerHTML=govs.map(g=>`<button class="chip ${document.getElementById("gov").value===g?'active':''}" onclick="setGov('${g}')">${g}</button>`).join("")}
function setGov(g){document.getElementById("gov").value=g;render();loadLive()}
function doSearch(){query=document.getElementById("q").value.trim();render();loadLive();document.getElementById("results").scrollIntoView({behavior:"smooth"})}
function searchMatch(x,q){
const n=normalize(q);
if(!n)return true;
const text=normalize([x.name,x.gov,x.city,x.cat,x.address,x.desc].join(" "));
if(text.includes(n))return true;
const aliases={
"قهوه":["مقهى","cafe","coffee"],"قهوة":["مقهى","cafe","coffee"],"cafe":["مقهى","coffee"],
"دواء":["صحة","صيدلية","pharmacie"],"pharmacie":["صحة","صيدلية"],
"خبز":["مخبزة","boulangerie"],"boulangerie":["مخبزة"],
"بيتزا":["مطعم","pizzeria","pizza"],"pizza":["مطعم","pizzeria"],"restaurant":["مطعم"],
"مطعم":["restaurant","pizzeria"],"ميكانيكي":["سيارات","garage","auto"],"كراج":["سيارات","garage"],
"garage":["سيارات","auto"],"سيارات":["auto","garage"],"متجر":["shop","store"],"shop":["متجر"]
};
return (aliases[n]||[]).some(a=>text.includes(normalize(a)));
}
function render(){
let gov=document.getElementById("gov").value;
let data=allData().filter(x=>(activeCat==="الكل"||x.cat===activeCat)&&(gov==="الكل"||x.gov===gov)&&searchMatch(x,query));
document.getElementById("count").textContent=data.length+" نتيجة";
document.getElementById("cards").innerHTML=data.length?data.map(card).join(""):`<div class="empty">😕<br><br>ما لقيناش نتيجة.<br>جرّب كلمة أخرى أو ولاية أخرى.</div>`;
renderChips();
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function card(x){
let key=x.name+"|"+x.gov, on=fav.includes(key), phone=x.phone||"";
let map=x.maps||("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((x.name+" "+x.city+" تونس")));
let rating=x.rating!==""?`⭐ ${esc(x.rating)}${x.reviews!==""?" ("+esc(x.reviews)+" avis)":""}`:"";
let address=x.address?`📍 ${esc(x.address)}`:`📍 ${esc(x.city||x.gov)}`;
return `<article class="card"><div class="cover"><span>${x.icon||"📍"}</span><button class="fav ${on?'on':''}" onclick="toggleFav('${esc(key)}')">${on?"♥":"♡"}</button></div><div class="cardbody"><div class="title">${esc(x.name)}</div><div class="meta">${address} · ${esc(x.cat)}</div><div class="desc">${esc(x.desc||"Établissement local")}${rating?"<br>"+rating:""}</div><div class="badges"><span class="badge">بيانات حقيقية</span><span class="badge">2026</span></div><div class="cardactions"><a class="call" href="${phone?'tel:+'+phone:'#'}">📞 اتصال</a><a class="wa" href="${phone?'https://wa.me/'+phone:'#'}" target="_blank">WhatsApp</a><a class="map" href="${esc(map)}" target="_blank">🗺️ اتجاهات</a></div></div></article>`
}
function toggleFav(k){let i=fav.indexOf(k);if(i>=0)fav.splice(i,1);else fav.push(k);save();render();toast(i>=0?"تحيّد من المفضلة":"تضاف للمفضلة")}
function nearMe(){
if(!navigator.geolocation){toast("المتصفح لا يدعم تحديد الموقع");return}
navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lon:p.coords.longitude};document.getElementById("status").textContent="📍 الموقع: تم تحديد موقعك";toast("تم تحديد موقعك بنجاح")},()=>toast("ما قدرناش نحدد موقعك"))
}
function addBusiness(){
let n=document.getElementById("aname").value.trim(),c=document.getElementById("acat").value,g=document.getElementById("agov").value.trim(),p=document.getElementById("aphone").value.trim();
if(!n||!g){toast("اكتب اسم النشاط والولاية");return}
custom.push({name:n,cat:c,gov:g,city:"",address:"",phone:p.replace(/\D/g,""),desc:"نشاط مضاف من طرف المستخدم.",icon:iconFor(c)});save();
document.getElementById("aname").value="";document.getElementById("aphone").value="";render();toast("تمت إضافة النشاط على جهازك")
}
function go(id,el){document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));el.classList.add("active");if(id==="home")window.scrollTo({top:0,behavior:"smooth"});else if(id==="cats")document.getElementById("categories").scrollIntoView({behavior:"smooth"});else if(id==="search")document.getElementById("search").scrollIntoView({behavior:"smooth"});else document.getElementById("add").scrollIntoView({behavior:"smooth"})}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove("show"),2200)}
renderCats();renderChips();render();loadData();
</script>
</body>
</html>
