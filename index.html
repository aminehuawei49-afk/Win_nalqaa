<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>وين نلقى؟</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f7f8;color:#17202a}
header{background:#0f766e;color:white;padding:22px 16px 18px;position:sticky;top:0;z-index:5}
header h1{margin:0 0 6px;font-size:28px}header p{margin:0 0 15px;opacity:.9}
.search{display:flex;gap:8px}.search input{flex:1;border:0;border-radius:12px;padding:14px;font-size:16px;outline:0}.search button{border:0;border-radius:12px;padding:0 18px;background:#fff;color:#0f766e;font-weight:bold;cursor:pointer}
main{max-width:900px;margin:auto;padding:16px 16px 90px}
h2{font-size:19px;margin:18px 0 10px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:5px}.chip{white-space:nowrap;border:1px solid #d5dddd;background:white;border-radius:20px;padding:9px 14px;cursor:pointer}.chip.active{background:#0f766e;color:#fff;border-color:#0f766e}
#status{margin:12px 0;color:#5f6b72}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000b}.card h3{margin:0 0 6px}.meta{color:#667085;font-size:14px;margin-bottom:8px}.desc{line-height:1.5;margin:8px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions a,.actions button{border:0;text-decoration:none;border-radius:10px;padding:10px 12px;cursor:pointer;background:#eef2f2;color:#123}.actions .primary{background:#0f766e;color:#fff}
.empty{background:#fff;padding:25px;border-radius:16px;text-align:center;color:#667085}
form{background:white;border-radius:16px;padding:16px;margin-top:12px}form input,form select,form textarea{width:100%;padding:12px;border:1px solid #d5dddd;border-radius:10px;margin:6px 0 10px;font-size:15px}form button{background:#0f766e;color:white;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:center;gap:5px;z-index:10}nav button{flex:1;max-width:220px;background:white;border:0;padding:12px 5px;cursor:pointer;font-size:13px;color:#344054}nav button strong{display:block;font-size:20px}
.hidden{display:none}
.badge{display:inline-block;background:#ecfdf3;color:#067647;border-radius:8px;padding:4px 8px;font-size:12px}
</style>
</head>
<body>
<header>
<h1>وين نلقى؟</h1>
<p>إبحث على الخدمات والأنشطة القريبة منك في تونس</p>
<div class="search">
<input id="searchInput" type="search" placeholder="مثال: مطعم، صيدلية، تونس..." aria-label="بحث">
<button id="searchBtn">بحث</button>
</div>
</header>

<main>
<section id="homeSection">
<h2>الولايات</h2>
<div class="chips" id="govs"></div>
<h2>التصنيفات</h2>
<div class="chips" id="cats"></div>
<div id="status"></div>
<div id="results"></div>
</section>

<section id="addSection" class="hidden">
<h2>إضافة نشاط</h2>
<form id="addForm">
<label>اسم النشاط</label><input id="newName" required>
<label>الولاية</label>
<select id="newGov"><option>تونس</option><option>أريانة</option><option>بن عروس</option><option>منوبة</option><option>سوسة</option><option>صفاقس</option><option>نابل</option><option>بنزرت</option><option>المنستير</option><option>المهدية</option><option>قابس</option><option>مدنين</option><option>القيروان</option></select>
<label>التصنيف</label><input id="newCat" placeholder="مثال: مطعم" required>
<label>الهاتف (اختياري)</label><input id="newPhone" type="tel" placeholder="+216...">
<label>الوصف</label><textarea id="newDesc" rows="3"></textarea>
<button type="submit">حفظ النشاط</button>
</form>
<p id="addMsg"></p>
</section>

<section id="favSection" class="hidden">
<h2>المفضلة ❤️</h2><div id="favorites"></div>
</section>
</main>

<nav>
<button id="homeBtn"><strong>⌂</strong>الرئيسية</button>
<button id="nearBtn"><strong>📍</strong>قريب مني</button>
<button id="favBtn"><strong>♥</strong>المفضلة</button>
<button id="addBtn"><strong>＋</strong>إضافة</button>
</nav>

<script>
const demo=[
{name:"مقهى المدينة",gov:"تونس",cat:"مقهى",phone:"+21671123456",desc:"مقهى في وسط تونس مع جلسات وخدمة سريعة",lat:36.8065,lng:10.1815},
{name:"مطعم قرطاج",gov:"تونس",cat:"مطعم",phone:"+21671234567",desc:"مطعم يقدم أكلات تونسية",lat:36.8528,lng:10.3230},
{name:"صيدلية النصر",gov:"أريانة",cat:"صيدلية",phone:"+21671987654",desc:"صيدلية وخدمة ليلية حسب المناوبة",lat:36.8667,lng:10.1647},
{name:"مخبزة سيدي بوسعيد",gov:"تونس",cat:"مخبزة",phone:"+21671345678",desc:"خبز وحلويات تونسية",lat:36.8700,lng:10.3410},
{name:"مطعم سوسة البحري",gov:"سوسة",cat:"مطعم",phone:"+21673234567",desc:"مطعم قريب من البحر",lat:35.8256,lng:10.63699},
{name:"مقهى سوسة",gov:"سوسة",cat:"مقهى",phone:"+21673345678",desc:"قهوة ومشروبات وحلويات",lat:35.8250,lng:10.6360},
{name:"صيدلية صفاقس المركز",gov:"صفاقس",cat:"صيدلية",phone:"+21674234567",desc:"صيدلية في وسط صفاقس",lat:34.7406,lng:10.7603},
{name:"مخبزة صفاقس",gov:"صفاقس",cat:"مخبزة",phone:"+21674345678",desc:"خبز وحلويات",lat:34.7390,lng:10.7610},
{name:"مطعم نابل",gov:"نابل",cat:"مطعم",phone:"+21672234567",desc:"أطباق تونسية ومأكولات سريعة",lat:36.4513,lng:10.7357},
{name:"مقهى بنزرت",gov:"بنزرت",cat:"مقهى",phone:"+21672456789",desc:"جلسات وقهوة",lat:37.2746,lng:9.8739},
{name:"مطعم المنستير",gov:"المنستير",cat:"مطعم",phone:"+21673456789",desc:"مطعم عائلي",lat:35.7770,lng:10.8262},
{name:"مقهى المهدية",gov:"المهدية",cat:"مقهى",phone:"+21673678901",desc:"قهوة ومشروبات",lat:35.5047,lng:11.0622}
];

let businesses=[...demo,...JSON.parse(localStorage.getItem("wn_custom")||"[]")];
let selectedGov="الكل",selectedCat="الكل",query="";
let userPos=null;

const $=id=>document.getElementById(id);
const govs=["الكل","تونس","أريانة","بن عروس","منوبة","سوسة","صفاقس","نابل","بنزرت","المنستير","المهدية","قابس","مدنين","القيروان"];
const cats=["الكل","مطعم","مقهى","صيدلية","مخبزة"];

function renderChips(){
 $("govs").innerHTML=govs.map(x=>`<button class="chip ${x===selectedGov?"active":""}" onclick="setGov('${x}')">${x}</button>`).join("");
 $("cats").innerHTML=cats.map(x=>`<button class="chip ${x===selectedCat?"active":""}" onclick="setCat('${x}')">${x}</button>`).join("");
}
window.setGov=x=>{selectedGov=x;renderChips();render()};
window.setCat=x=>{selectedCat=x;renderChips();render()};

function distance(lat,lng){
 if(!userPos||lat==null||lng==null)return null;
 const R=6371,a=Math.PI/180,dLat=(lat-userPos.lat)*a,dLng=(lng-userPos.lng)*a;
 const q=Math.sin(dLat/2)**2+Math.cos(userPos.lat*a)*Math.cos(lat*a)*Math.sin(dLng/2)**2;
 return 2*R*Math.asin(Math.sqrt(q));
}
function render(){
 let list=businesses.filter(b=>
   (selectedGov==="الكل"||b.gov===selectedGov)&&
   (selectedCat==="الكل"||b.cat===selectedCat)&&
   (!query||(b.name+" "+b.gov+" "+b.cat+" "+b.desc).toLowerCase().includes(query.toLowerCase()))
 );
 $("status").textContent=`${list.length} نتيجة${query?" للبحث عن «"+query+"»":""}`;
 if(!list.length){$("results").innerHTML='<div class="empty">لا توجد نتائج. جرب كلمة أخرى أو ولاية أخرى.</div>';return}
 $("results").innerHTML=list.map((b,i)=>{
   const d=distance(b.lat,b.lng); const key=encodeURIComponent(b.name);
   const fav=(JSON.parse(localStorage.getItem("wn_fav")||"[]")).includes(b.name);
   const map=b.lat!=null?`https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}`:"#";
   const wa=b.phone?`https://wa.me/${b.phone.replace(/[^0-9]/g,"")}`:"#";
   return `<article class="card"><h3>${b.name} ${fav?"❤️":""}</h3>
   <div class="meta">${b.gov} · ${b.cat} ${d!=null?` · ${d.toFixed(1)} كم`:""}</div>
   <span class="badge">متاح في قائمة البحث</span><div class="desc">${b.desc||""}</div>
   <div class="actions">
   ${b.phone?`<a class="primary" href="tel:${b.phone}">📞 اتصال</a>`:""}
   ${b.phone?`<a href="${wa}" target="_blank" rel="noopener">💬 WhatsApp</a>`:""}
   ${b.lat!=null?`<a href="${map}" target="_blank" rel="noopener">🗺️ الاتجاهات</a>`:""}
   <button onclick="toggleFav('${key}')">❤️ مفضلة</button>
   <button onclick="shareItem('${key}')">↗ مشاركة</button>
   </div></article>`;
 }).join("");
}
window.toggleFav=key=>{const name=decodeURIComponent(key);let f=JSON.parse(localStorage.getItem("wn_fav")||"[]");f=f.includes(name)?f.filter(x=>x!==name):[...f,name];localStorage.setItem("wn_fav",JSON.stringify(f));render();renderFav()};
window.shareItem=async key=>{const name=decodeURIComponent(key);const b=businesses.find(x=>x.name===name);try{if(navigator.share)await navigator.share({title:b.name,text:`${b.name} - ${b.cat} - ${b.gov}`});else await navigator.clipboard.writeText(`${b.name} - ${b.cat} - ${b.gov}`);alert("تمت المشاركة / النسخ")}catch(e){}};

function doSearch(){query=$("searchInput").value.trim();show("home");render()}
$("searchBtn").onclick=doSearch;$("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch()});
function show(which){
 $("homeSection").classList.toggle("hidden",which!=="home");
 $("addSection").classList.toggle("hidden",which!=="add");
 $("favSection").classList.toggle("hidden",which!=="fav");
 if(which==="fav")renderFav();
}
$("homeBtn").onclick=()=>show("home");
$("favBtn").onclick=()=>show("fav");
$("addBtn").onclick=()=>show("add");
$("nearBtn").onclick=()=>{
 if(!navigator.geolocation){alert("الموقع غير مدعوم في هذا المتصفح");return}
 navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lng:p.coords.longitude};selectedGov="الكل";selectedCat="الكل";query="";$("searchInput").value="";show("home");render();alert("تم تحديد موقعك وترتيب المسافات");},()=>alert("لم نتمكن من الوصول إلى موقعك. اسمح للموقع من المتصفح."));
};
function renderFav(){
 const f=JSON.parse(localStorage.getItem("wn_fav")||"[]"), list=businesses.filter(b=>f.includes(b.name));
 $("favorites").innerHTML=list.length?list.map(b=>`<div class="card"><h3>${b.name}</h3><div class="meta">${b.gov} · ${b.cat}</div><button class="primary" onclick="query='${b.name.replace(/'/g,"\\'")}';$('searchInput').value=query;show('home');render()">فتح</button></div>`).join(""):'<div class="empty">لا توجد أنشطة في المفضلة.</div>';
}
$("addForm").onsubmit=e=>{
 e.preventDefault();
 const b={name:$("newName").value.trim(),gov:$("newGov").value,cat:$("newCat").value.trim(),phone:$("newPhone").value.trim(),desc:$("newDesc").value.trim()};
 businesses.push(b);localStorage.setItem("wn_custom",JSON.stringify(businesses.slice(demo.length)));
 $("addMsg").textContent="تم حفظ النشاط على هذا الجهاز ✅";e.target.reset();
};
renderChips();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
