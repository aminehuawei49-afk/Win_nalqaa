<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1111">
<title>وين نلقى؟</title>
<style>
:root{--bg:#0d1010;--panel:#171a1a;--panel2:#202424;--line:#2c3030;--text:#f5f7f6;--muted:#aeb5b3;--accent:#36b6d3;--accent2:#218ca5;--danger:#ff6b7a;--shadow:0 12px 30px rgba(0,0,0,.25)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:980px;margin:auto;min-height:100vh;padding-bottom:92px}
.top{padding:24px 18px 12px;background:linear-gradient(180deg,#111414,#0d1010)}
.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:var(--accent);display:grid;place-items:center;font-size:26px;box-shadow:0 8px 22px rgba(54,182,211,.18)}
.brand small{display:block;color:var(--muted);font-size:14px;margin-bottom:3px}.brand strong{font-size:29px}
.hero{padding:12px 18px 20px}.hero h1{font-size:35px;margin:4px 0 8px}.hero p{color:#d0d5d4;font-size:18px;line-height:1.7;margin:0}
.searchbox{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;margin:0 18px;box-shadow:var(--shadow)}
.label{font-size:16px;font-weight:700;margin:0 0 8px}.field{display:flex;gap:9px;margin-bottom:13px}.field input,.field select,.field textarea{width:100%;border:0;outline:0;background:var(--panel2);color:var(--text);border-radius:13px;padding:14px 15px}
.field input::placeholder,.field textarea::placeholder{color:#777f7d}.primary,.secondary{border:0;border-radius:13px;padding:13px 18px;font-weight:800}.primary{background:var(--accent);color:#071012}.secondary{background:#303535;color:white}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{color:var(--muted);font-size:14px;margin:12px 2px 0}
.section{padding:22px 18px 0}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section h2{font-size:23px;margin:0}.link{color:var(--accent);background:none;border:0;font-weight:700}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cat{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px 8px;text-align:center;color:white}.cat .ico{font-size:29px;display:block;margin-bottom:7px}.cat span{font-size:13px}.cat.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#182629}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 1px 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:#dfe3e2;border-radius:999px;padding:9px 14px}.chip.active{background:var(--accent);color:#071012;border-color:var(--accent);font-weight:800}
.results-meta{color:var(--muted);font-size:14px;margin:4px 0 12px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.15)}.cover{height:120px;background:linear-gradient(135deg,#1c3439,#263133);display:grid;place-items:center;font-size:48px;position:relative}.fav{position:absolute;top:10px;left:10px;width:39px;height:39px;border:0;border-radius:50%;background:rgba(0,0,0,.38);color:white;font-size:20px}.fav.on{color:#ff7080}.cardbody{padding:13px}.title{font-size:19px;font-weight:800;margin-bottom:5px}.meta{color:var(--muted);font-size:13px;margin-bottom:7px}.desc{font-size:13px;color:#d1d6d5;line-height:1.55;min-height:40px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.badge{font-size:11px;border-radius:999px;background:#273132;color:#bfe8f0;padding:5px 8px}.cardactions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.cardactions a,.cardactions button{border:0;border-radius:10px;padding:9px 4px;text-align:center;text-decoration:none;font-size:12px;font-weight:700}.call{background:var(--accent);color:#071012}.wa{background:#2b453a;color:#d7ffe9}.map{background:#303535;color:white}
.empty{background:var(--panel);border:1px dashed #3b4141;border-radius:18px;padding:30px;text-align:center;color:var(--muted)}
.bottom{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(944px,calc(100% - 22px));background:rgba(18,22,22,.96);border:1px solid #303535;border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);padding:7px;z-index:20;box-shadow:0 15px 35px rgba(0,0,0,.45);backdrop-filter:blur(10px)}.nav{border:0;background:none;color:#8f9795;padding:8px 4px;border-radius:16px}.nav b{display:block;font-size:21px;margin-bottom:3px}.nav span{font-size:11px}.nav.active{color:white;background:#17353b}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:end;justify-content:center;z-index:50}.modal.show{display:flex}.sheet{width:min(700px,100%);background:#151818;border-radius:25px 25px 0 0;padding:20px;border:1px solid var(--line);max-height:90vh;overflow:auto}.sheet h3{margin-top:0;font-size:23px}.close{float:left;background:#2d3232;color:white;border:0;border-radius:50%;width:36px;height:36px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-20px);background:#f4f7f6;color:#111;padding:11px 17px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:100;font-weight:700}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:650px){.hero h1{font-size:31px}.categories{grid-template-columns:repeat(4,1fr);gap:7px}.cat{padding:12px 4px}.cat .ico{font-size:24px}.cat span{font-size:11px}.cards{grid-template-columns:1fr}.cover{height:105px}.searchbox{margin:0 12px}.section,.hero,.top{padding-left:12px;padding-right:12px}.bottom{bottom:8px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app">
<header class="top">
  <div class="brand"><div class="logo">📍</div><div><small>دليل الخدمات والأماكن في تونس</small><strong>وين نلقى؟</strong></div></div>
</header>

<section class="hero">
  <h1>وين نلقى؟</h1>
  <p>جاوب على سؤال: وين نلقى الحاجة اللي نحتاجها توا؟</p>
</section>

<section class="searchbox" id="search">
  <div class="label">🔎 شنوة تحب تلقى؟</div>
  <div class="field"><input id="q" placeholder="مثال: بيطري مفتوح، علف، ميكانيكي قريب..." onkeydown="if(event.key==='Enter')doSearch()"><button class="primary" onclick="doSearch()">لوج</button></div>
  <div class="label">الولاية</div>
  <div class="field"><select id="gov" onchange="render()"><option value="الكل">الشمال، الوسط، الكل</option><option>تونس</option><option>أريانة</option><option>بن عروس</option><option>نابل</option><option>بنزرت</option><option>سوسة</option><option>المنستير</option><option>المهدية</option><option>صفاقس</option><option>قابس</option><option>مدنين</option><option>قفصة</option><option>توزر</option><option>قبلي</option><option>القيروان</option><option>زغوان</option><option>باجة</option><option>جندوبة</option><option>الكاف</option><option>سليانة</option><option>القصرين</option><option>سيدي بوزيد</option><option>تطاوين</option></select></div>
  <div class="actions"><button class="primary" onclick="doSearch()">🔎 لوج توا</button><button class="secondary" onclick="nearMe()">🎯 حدد موقعي</button></div>
  <div class="status" id="status">📍 الموقع: غير محدد</div>
</section>

<section class="section">
 <div class="section-head"><h2>الفئات الرئيسية</h2><button class="link" onclick="selectCat('الكل')">الكل</button></div>
 <div class="categories" id="categories"></div>
</section>

<section class="section">
 <div class="section-head"><h2>الولايات</h2><span class="results-meta">اختار ولاية</span></div>
 <div class="chips" id="govchips"></div>
</section>

<section class="section" id="results">
 <div class="section-head"><h2>النتائج</h2><span class="results-meta" id="count"></span></div>
 <div class="cards" id="cards"></div>
</section>

<section class="section" id="add">
 <div class="section-head"><h2>أضف نشاطك</h2></div>
 <div class="searchbox" style="margin:0">
   <div class="field"><input id="aname" placeholder="اسم النشاط"></div>
   <div class="field"><select id="acat"><option>مطعم</option><option>مقهى</option><option>صحة</option><option>متجر</option><option>خدمات</option><option>سيارات</option><option>مخبزة</option><option>أخرى</option></select></div>
   <div class="field"><input id="agov" placeholder="الولاية"></div>
   <div class="field"><input id="aphone" placeholder="رقم الهاتف"></div>
   <button class="primary" style="width:100%" onclick="addBusiness()">➕ أضف النشاط</button>
 </div>
</section>
</div>

<nav class="bottom">
 <button class="nav active" onclick="go('home',this)"><b>⌂</b><span>الرئيسية</span></button>
 <button class="nav" onclick="go('cats',this)"><b>▦</b><span>الفئات</span></button>
 <button class="nav" onclick="go('search',this)"><b>⌕</b><span>البحث</span></button>
 <button class="nav" onclick="go('add',this)"><b>＋</b><span>أنشطتي</span></button>
</nav>

<div class="modal" id="favModal" onclick="if(event.target.id==='favModal')this.classList.remove('show')">
 <div class="sheet"><button class="close" onclick="document.getElementById('favModal').classList.remove('show')">×</button><h3>❤️ المفضلة</h3><div id="favList"></div></div>
</div>

<script>
const base=[
{name:"مقهى المدينة",cat:"مقهى",gov:"تونس",desc:"مقهى في وسط تونس مع جلسات وخدمة سريعة.",phone:"21671000000",icon:"☕",lat:36.8065,lon:10.1815},
{name:"مطعم قرطاج",cat:"مطعم",gov:"تونس",desc:"مطعم تونسي وعائلي بالقرب من قرطاج.",phone:"21671200000",icon:"🍽️",lat:36.8529,lon:10.3234},
{name:"صيدلية النصر",cat:"صحة",gov:"أريانة",desc:"صيدلية وخدمات صحية.",phone:"21671100000",icon:"💊",lat:36.8665,lon:10.1647},
{name:"مخبزة سيدي بوسعيد",cat:"مخبزة",gov:"تونس",desc:"خبز وحلويات ومخبوزات يومية.",phone:"21671300000",icon:"🥖",lat:36.8687,lon:10.3417},
{name:"مطعم سوسة البحري",cat:"مطعم",gov:"سوسة",desc:"مأكولات بحرية وأطباق تونسية.",phone:"21673200000",icon:"🐟",lat:35.8256,lon:10.63699},
{name:"مقهى سوسة",cat:"مقهى",gov:"سوسة",desc:"قهوة وجلسات مريحة.",phone:"21673300000",icon:"☕",lat:35.8256,lon:10.63699},
{name:"صيدلية صفاقس المركز",cat:"صحة",gov:"صفاقس",desc:"صيدلية وخدمات صحية.",phone:"21674200000",icon:"💊",lat:34.7406,lon:10.7603},
{name:"مخبزة صفاقس",cat:"مخبزة",gov:"صفاقس",desc:"مخبوزات وحلويات تونسية.",phone:"21674300000",icon:"🥖",lat:34.7406,lon:10.7603},
{name:"مطعم نابل",cat:"مطعم",gov:"نابل",desc:"أطباق تونسية ومأكولات عائلية.",phone:"21672200000",icon:"🍽️",lat:36.4513,lon:10.7357},
{name:"مقهى بنزرت",cat:"مقهى",gov:"بنزرت",desc:"قهوة ومشروبات وجلسات.",phone:"21672400000",icon:"☕",lat:37.2746,lon:9.8739},
{name:"مطعم المنستير",cat:"مطعم",gov:"المنستير",desc:"مطعم عائلي ومأكولات متنوعة.",phone:"21673400000",icon:"🍽️",lat:35.7643,lon:10.8113},
{name:"مقهى المهدية",cat:"مقهى",gov:"المهدية",desc:"قهوة وجلسة قريبة من البحر.",phone:"21673600000",icon:"☕",lat:35.5047,lon:11.0622}
];
const cats=[["الكل","✨"],["مطعم","🍽️"],["مقهى","☕"],["صحة","💊"],["مخبزة","🥖"],["متجر","🛒"],["خدمات","🔧"],["سيارات","🚗"]];
let custom=safeGet("wn_custom",[]), fav=safeGet("wn_fav",[]), activeCat="الكل", query="", userPos=null;

function safeGet(k,f){try{let x=JSON.parse(localStorage.getItem(k));return x??f}catch(e){return f}}
function save(){try{localStorage.setItem("wn_custom",JSON.stringify(custom));localStorage.setItem("wn_fav",JSON.stringify(fav))}catch(e){}}
function allData(){return base.concat(custom)}
function selectCat(c){activeCat=c;renderCats();render()}
function renderCats(){document.getElementById("categories").innerHTML=cats.map(x=>`<button class="cat ${activeCat===x[0]?'active':''}" onclick="selectCat('${x[0]}')"><span class="ico">${x[1]}</span><span>${x[0]}</span></button>`).join("")}
function renderChips(){let gs=["الكل","تونس","أريانة","بن عروس","نابل","بنزرت","سوسة","المنستير","المهدية","صفاقس","قابس","مدنين","قفصة","باجة","جندوبة","الكاف","القيروان","القصرين","سيدي بوزيد","تطاوين"];document.getElementById("govchips").innerHTML=gs.map(g=>`<button class="chip ${document.getElementById("gov").value===g?'active':''}" onclick="setGov('${g}')">${g}</button>`).join("")}
function setGov(g){document.getElementById("gov").value=g;render()}
function doSearch(){query=document.getElementById("q").value.trim().toLowerCase();render();document.getElementById("results").scrollIntoView({behavior:"smooth"})}
function render(){
 let gov=document.getElementById("gov").value, data=allData().filter(x=>(activeCat==="الكل"||x.cat===activeCat)&&(gov==="الكل"||x.gov===gov));
 if(query)data=data.filter(x=>(x.name+" "+x.gov+" "+x.cat+" "+x.desc).toLowerCase().includes(query));
 document.getElementById("count").textContent=data.length+" نتيجة";
 document.getElementById("cards").innerHTML=data.length?data.map(card).join(""):`<div class="empty">😕<br><br>ما لقيناش نتيجة.<br>جرّب كلمة أخرى أو ولاية أخرى.</div>`;
 renderChips();
}
function card(x){
 let key=x.name+"|"+x.gov, on=fav.includes(key), phone=x.phone||"";
 return `<article class="card"><div class="cover"><span>${x.icon||"📍"}</span><button class="fav ${on?'on':''}" onclick="toggleFav('${key.replaceAll("'","")}')">${on?"♥":"♡"}</button></div><div class="cardbody"><div class="title">${x.name}</div><div class="meta">📍 ${x.gov} · ${x.cat}</div><div class="desc">${x.desc}</div><div class="badges"><span class="badge">متاح</span><span class="badge">موثوق</span></div><div class="cardactions"><a class="call" href="${phone?'tel:+'+phone:'#'}">📞 اتصال</a><a class="wa" href="${phone?'https://wa.me/'+phone:'#'}" target="_blank">WhatsApp</a><a class="map" href="https://www.google.com/maps/search/?api=1&query=${x.lat},${x.lon}" target="_blank">🗺️ اتجاهات</a></div></div></article>`
}
function toggleFav(k){let i=fav.indexOf(k);if(i>=0)fav.splice(i,1);else fav.push(k);save();render();toast(i>=0?"تحيّد من المفضلة":"تضاف للمفضلة")}
function nearMe(){
 if(!navigator.geolocation){toast("المتصفح لا يدعم تحديد الموقع");return}
 navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lon:p.coords.longitude};document.getElementById("status").textContent="📍 الموقع: تم تحديد موقعك";toast("تم تحديد موقعك بنجاح")},()=>toast("ما قدرناش نحدد موقعك"))
}
function addBusiness(){
 let n=document.getElementById("aname").value.trim(),c=document.getElementById("acat").value,g=document.getElementById("agov").value.trim(),p=document.getElementById("aphone").value.trim();
 if(!n||!g){toast("اكتب اسم النشاط والولاية");return}
 custom.push({name:n,cat:c,gov:g,desc:"نشاط مضاف من طرف المستخدم.",phone:p.replace(/\D/g,""),icon:c==="مطعم"?"🍽️":c==="مقهى"?"☕":c==="صحة"?"💊":c==="مخبزة"?"🥖":"📍",lat:36.8065,lon:10.1815});save();document.getElementById("aname").value="";document.getElementById("aphone").value="";render();toast("تمت إضافة النشاط على جهازك")}
function go(id,el){document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));el.classList.add("active");if(id==="home")window.scrollTo({top:0,behavior:"smooth"});else if(id==="cats")document.getElementById("categories").scrollIntoView({behavior:"smooth"});else if(id==="search")document.getElementById("search").scrollIntoView({behavior:"smooth"});else document.getElementById("add").scrollIntoView({behavior:"smooth"})}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove("show"),2200)}
renderCats();renderChips();render();
</script>
</body>
</html>
